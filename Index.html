
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>MujiBOT 🤖</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  height: 100dvh;
  display: flex;
  justify-content: center;
}
.app {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 16px;
}
header {
  text-align: center;
  padding: 16px;
  border-bottom: 1px solid #28364b;
}
header h1 { margin: 0; color: #61e7ff; }
header p { color: #9baac0; font-size: 13px; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px 0;
}
.msg {
  padding: 12px 15px;
  border-radius: 16px;
  margin: 10px 0;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.bot { background: #202e43; margin-right: 25px; }
.user { background: #075e75; margin-left: 25px; }
form { display: flex; gap: 8px; padding: 10px 0; }
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #35445c;
  background: #202e43;
  color: white;
  font-size: 16px;
}
button {
  border: 0;
  border-radius: 14px;
  padding: 12px 16px;
  background: #61e7ff;
  color: #101827;
  font-weight: bold;
}
#status { color: #9baac0; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🤖 MujiBOT</h1>
    <p>Senin yapay zekâ arkadaşın</p>
  </header>
  <main id="chat">
    <div class="msg bot">Selam knk! Ben MujiBOT 😎🔥
Burası benim yeni evim!</div>
  </main>
  <div id="status">Henüz demo modunda</div>
  <form id="form">
    <input id="input" placeholder="MujiBOT'a yaz..." autocomplete="off">
    <button type="submit">Gönder</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const statusText = document.getElementById("status");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const t = text.toLocaleLowerCase("tr-TR");
  let reply = "Bunu henüz öğrenmedim knk 😅 Gerçek yapay zekâ bağlantısını sonraki adımda ekleyeceğiz.";

  if (t.includes("selam") || t.includes("merhaba"))
    reply = "Aleyküm selam knk! 😎🔥";
  else if (t.includes("nasılsın"))
    reply = "İyiyim knk, sen nasılsın? ❤️";
  else if (t.includes("adın ne") || t.includes("kimsin"))
    reply = "Ben MujiBOT! Senin yapay zekâ arkadaşınım 🤖";
  else if (t.includes("robux"))
    reply = "ROBux mu dedin knk?! 💸🔥";
  else if (t.includes("şaka"))
    reply = "Bilgisayar neden doktora gitmiş? Virüs kapmış! 😂";
  else if (t.includes("teşekkür"))
    reply = "Her zaman knk! ❤️";
  else if (t === "çık")
    reply = "Ben buradayım knk, istediğin zaman konuşuruz 😎";

  setTimeout(() => addMessage(reply, "bot"), 300);
});

</script>
</body>
</html>
